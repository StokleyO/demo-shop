<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cart · Stride Shoes</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="/shop.css"></head>
<body>
<script src="/shop.js"></script>
<script>header()</script>
<main class="narrow">
  <h1>Your cart</h1>
  <div class="panel">
    <div id="items"></div>
    <p id="empty" hidden>Your cart is empty. <a href="/">Keep shopping</a></p>
    <a class="button wide" id="checkout" href="/checkout/address">Checkout</a>
  </div>
</main>
<script>
  const items = cart.get();
  let total = 0;
  for (const it of items) {
    const p = PRODUCTS[it.id];
    total += p.price;
    document.getElementById("items").insertAdjacentHTML("beforeend", `<div class="row"><span class="line"><span data-shoe="${it.id}"></span><span>${p.name} · size ${it.size}</span></span><span>${money(p.price)}</span></div>`);
  }
  if (items.length) document.getElementById("items").insertAdjacentHTML("beforeend", `<div class="row" style="margin-bottom:20px"><strong>Subtotal</strong><strong>${money(total)}</strong></div>`);
  else { document.getElementById("empty").hidden = false; document.getElementById("checkout").hidden = true; }
</script>
</body>
</html>
